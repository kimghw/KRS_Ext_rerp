<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R&D ERP 현황</title>
<link rel="stylesheet" href="../lib/panel.css">
<script src="mode.js"></script>
<style>
  /* 팝업 창은 최대 600px. 문서는 스크롤하지 않고 패널만 스크롤해(이중 스크롤 방지) 아래 툴바는 항상 보이게 */
  html, body { margin: 0; overflow: hidden; }
  body { width: 460px; max-height: 600px; display: flex; flex-direction: column; background: #fff; font: 13px/1.45 -apple-system, "Segoe UI", "Malgun Gothic", "맑은 고딕", Roboto, sans-serif; }
  .krext-panel.krext-popup { flex: 1 1 auto; min-height: 0; max-height: none; overflow: auto; }
  /* 사이드 패널(또는 탭)에 떴을 때(mode.js → html.krext-side): 크기는 패널이 정하므로 문서를 꽉 채우고, 좁으면(사이드 패널 최소 폭 320px 남짓) 아래 툴바는 줄을 바꾼다 */
  html.krext-side body { width: auto; min-width: 300px; height: 100vh; max-height: none; }
  html.krext-side .krext-panel.krext-popup { width: auto; }
  html.krext-side .toolbar { flex-wrap: wrap; }
  /* 브라우저 탭(mode.js → html.krext-tab — 사업비 관리 [참여인력 변경]): 넓은 창에서 가운데 1120px 까지만, 바탕은 회색. 참여인력만(html.krext-only)이면 Help Chat 줄·아래 툴바는 숨김(공유 (Plus) 줄은 둠 — 계획이 공유 폴더로 맞춰지는지 보이게) */
  html.krext-tab { background: #e9ecf1; }
  html.krext-tab body { max-width: 1120px; margin: 0 auto; border-left: 1px solid #d5dbe4; border-right: 1px solid #d5dbe4; }
  html.krext-tab.krext-only body { max-width: 1200px; border: 0; background: #f3f6fa; }
  html.krext-only .helpbar, html.krext-only .toolbar { display: none; }
  .toolbar { flex: none; display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid #e1e6ee; background: #f7f9fc; }
  .toolbar a, .toolbar button { flex: 1 1 auto; white-space: nowrap; text-align: center; padding: 6px 4px; border: 1px solid #c9d1dc; border-radius: 6px; background: #fff; color: #1f4e9c; text-decoration: none; font: inherit; cursor: pointer; }
  .toolbar a:hover, .toolbar button:hover { background: #eef3fa; }
  /* 공유 (Plus) 켜기 + 마지막 동기화 상태 한 줄 (설정 페이지 › 공유 (Plus) 탭의 같은 항목과 같은 값, popup.js) */
  .plusbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid #e1e6ee; background: #fbfbfe; font-size: 12px; color: #2b2b46; }
  .plusbar label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer; }
  .plusbar .plus-status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #5b6470; }
  .plusbar .plus-status.err { color: #b3261e; }
  .plusbar .plus-status a { color: #1f4e9c; }   /* 로그인 필요 때 "OneDrive 열기" */
  /* Help Chat: 한 줄 입력 + 한 줄 상태(누르면 로그 펼침). 이 PC 의 Help 서버(help-server/server.js)가 Claude Code CLI 로 확장 코드를 고친다 (popup/help.js) */
  .helpbar { flex: none; padding: 6px 10px; border-top: 1px solid #e1e6ee; background: #f7f9fc; font-size: 12px; color: #2b2b46; }
  .helpbar form { display: flex; gap: 6px; margin: 0; }
  .helpbar input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 12px; padding: 4px 6px; border: 1px solid #c9d1dc; border-radius: 5px; background: #fff; }
  .helpbar input[type=text]:disabled { background: #eef1f6; }
  .helpbar button { flex: none; font: inherit; font-size: 12px; padding: 3px 8px; border: 1px solid #c9d1dc; border-radius: 5px; background: #fff; color: #1f4e9c; cursor: pointer; }
  .helpbar button:hover:not(:disabled) { background: #eef3fa; }
  .helpbar button:disabled { color: #9aa3af; cursor: default; }
  .helpbar .help-row { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .helpbar .help-status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #5b6470; cursor: pointer; }
  .helpbar .help-status.ok { color: #1b6e3c; }
  .helpbar .help-status.err { color: #b3261e; }
  .helpbar .help-status.run { color: #1f4e9c; }
  .helpbar #helpApply { border-color: #1b6e3c; color: #1b6e3c; font-weight: 600; }
  .helpbar .help-lines { margin-top: 5px; max-height: 132px; overflow: auto; padding: 4px 6px; border: 1px solid #e1e6ee; border-radius: 5px; background: #fff; font-size: 11px; line-height: 1.5; color: #3c4553; }
  .helpbar .help-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .helpbar .help-line .t { color: #9aa3af; }
  .helpbar .help-line.ok { color: #1b6e3c; }
  .helpbar .help-line.err, .helpbar .help-line.warn { color: #b3261e; }
  .helpbar .help-line.say { color: #2b2b46; }
  .helpbar .help-detail { margin-top: 4px; padding-top: 4px; border-top: 1px dashed #e1e6ee; white-space: pre-wrap; word-break: break-word; color: #2b2b46; }
</style>
</head>
<body>
<div id="krext-panel" class="krext-panel krext-popup"></div>
<div class="helpbar" id="helpbar" title="Help Chat: 확장이 기대와 다르게 동작하거나 고치고 싶은 점을 한 줄로 보내면, 이 PC 의 Help 서버(node help-server/server.js)가 Claude Code CLI(Opus 5.5)로 확장 코드를 고칩니다. 이 창을 닫아도 계속되고, 끝나면 '적용'으로 확장을 다시 불러옵니다 (커밋은 하지 않음)">
  <form id="helpForm">
    <input type="text" id="helpText" maxlength="2000" autocomplete="off" spellcheck="false" placeholder="Help Chat — 고칠 점이나 이상한 결과를 한 줄로 적고 Enter">
    <button type="submit" id="helpSend" title="보내기 (Enter)">보내기</button>
  </form>
  <div class="help-row" id="helpRow" hidden>
    <span id="helpStatus" class="help-status" role="status"></span>
    <button type="button" id="helpApply" hidden title="확장을 다시 불러와 바뀐 코드를 적용합니다 (이 창은 닫힙니다)">적용</button>
    <button type="button" id="helpStop" hidden>중지</button>
    <button type="button" id="helpNew" hidden title="이 결과를 지우고, 다음 요청을 이전 대화와 잇지 않습니다">새 대화</button>
    <button type="button" id="helpSetup" hidden title="Help 서버를 아직 못 붙인 PC 용: 준비물 확인(Node · git · Claude Code CLI · 로그인)과 서버 실행을 Claude Code 에 시키는 글을 복사합니다 — 저장소 폴더(확장을 로드한 폴더)에서 연 Claude Code 에 붙여 넣으세요">설정 프롬프트 복사</button>
  </div>
  <div class="help-lines" id="helpLines" hidden></div>
</div>
<div class="plusbar" title="공유 (Plus): 과제마다 OneDrive(SharePoint) 폴더 하나(내 OneDrive 문서/업무/shared 아래 약칭 → Job Id → 과제번호)에 연차별 파일(과제 정보 · 예산 · 참여연구원 계획 · 연구내용 · 변경이력)과 예상비용.json 을 두고 참여연구원과 맞춥니다 — 이 브라우저가 SharePoint 에 로그인돼 있으면 됩니다(서버·앱 등록 없음). 폴더를 만들 때 참여연구원에게 자동 공유되고, 공유받은 사람은 켜 두기만 하면 '나와 공유'에서 저절로 찾습니다. 켜면 바로 한 번 맞추고 그 뒤로는 패널을 열 때·항목을 바꿀 때 저절로 (밑폴더 주소·연결 확인·참여연구원 공유·과제별 표는 설정 페이지 › 공유 (Plus))">
  <label><input type="checkbox" id="plusOn"> 공유 (Plus)</label>
  <span id="plusStatus" class="plus-status"></span>
</div>
<div class="toolbar">
  <a href="https://eclass.krs.co.kr/eClassVer4/Home/Index" target="_blank" rel="noopener">eClass 열기</a>
  <a id="rndLink" href="https://rnd.krs.co.kr/rderp_layoutMain.act" target="_blank" rel="noopener">R&amp;D ERP 열기</a>
  <a id="hrLink" href="https://eclass.krs.co.kr/eClassVer4/External/SSOMessage" target="_blank" rel="noopener">HR System 열기</a>
  <a id="rcmsLink" href="https://www.rcms.go.kr/index.do" target="_blank" rel="noopener" title="RCMS(www.rcms.go.kr)를 열고, 설정에 ID·비밀번호가 있으면 자동으로 로그인합니다 (2차 인증은 직접)">RCMS 열기</a>
  <button type="button" id="btnOptions">설정</button>
</div>
<script src="../lib/help-setup.js"></script><!-- Help 서버를 못 붙인 PC 용 설정 프롬프트 (help.js 는 이 파일이 없어도 짧은 글로 대신) -->
<script src="help.js"></script>
<script src="../lib/format.js"></script>
<script src="../lib/settings.js"></script>
<script src="../lib/plan.js"></script>
<script src="../lib/pay.js"></script>
<script src="../lib/part.js"></script>
<script src="../lib/fetch-sites.js"></script>
<script src="../lib/prep.js"></script>
<script src="../lib/research.js"></script>
<script src="../lib/staff.js"></script><!-- 사업비: 과제마다 연차별 참여연구원 참여율·지급액 계산 (0.8.7) -->
<script src="../lib/staff-ui.js"></script><!-- 제목 줄 사업비 관리 화면 그리기·입력 처리 -->
<script src="../lib/render.js"></script>
<script src="capture.js"></script>
<script src="popup.js"></script>
</body>
</html>
